<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | InternTrack</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div class="login-page">
  <div class="login-container">
    
    <img src="assets/img/uitm2.png" alt="UiTM Logo" style="width: 100px; height: auto; display: block; margin: 0 auto 15px;">

    <div class="login-header text-center mb-4">
        <h4 class="fw-bold" style="color: #5d2884;">InternTrack Login</h4>
        <p class="text-muted small">Student Internship System</p>
    </div>

    <div id="error" class="text-danger text-center mb-2 small fw-bold"></div>

    <div class="mb-3">
        <input type="text" id="username" class="form-control" placeholder="Username">
    </div>
    
    <div class="mb-2">
        <input type="password" id="password" class="form-control" placeholder="Password">
    </div>

    <div class="text-end mb-4">
        <a href="#" onclick="forgotPass()" class="small text-decoration-none" style="color: #7023d5; font-weight: 600;">
            Forgot Password?
        </a>
    </div>

    <button type="button" onclick="login()" class="btn w-100 text-white fw-bold mb-3" style="background-color: #7023d5; padding: 10px;">
        Login
    </button>

    <div class="text-center">
        <p class="small text-muted mb-0">Don't have an account?</p>
        <a href="#" onclick="signUp()" class="fw-bold text-decoration-none" style="color: #5d2884;">
            Create New Account
        </a>
    </div>

    <small class="d-block text-center mt-4 text-muted">
      IMS566 Advanced Web Design
    </small>

  </div>
</div>

<script src="assets/js/auth.js"></script>

<script>
    // --- 1. SIGN UP FUNCTION ---
    async function signUp() {
        const { value: formValues } = await Swal.fire({
            title: 'Register Account',
            html:
                '<input id="swal-input1" class="swal2-input" placeholder="New Username">' +
                '<input id="swal-input2" class="swal2-input" type="password" placeholder="New Password">',
            focusConfirm: false,
            confirmButtonText: 'Register',
            confirmButtonColor: '#198754', // Green color
            showCancelButton: true,
            preConfirm: () => {
                return [
                    document.getElementById('swal-input1').value,
                    document.getElementById('swal-input2').value
                ]
            }
        });

        if (formValues) {
            const [newUser, newPass] = formValues;
            
            if(newUser && newPass) {
                // Save to LocalStorage (Simulated Database)
                localStorage.setItem("validUser", newUser);
                localStorage.setItem("validPass", newPass);

                Swal.fire({
                    title: 'Success!',
                    text: 'Account created successfully! You can now login.',
                    icon: 'success',
                    confirmButtonColor: '#7023d5'
                });
            } else {
                Swal.fire('Error', 'Please enter both username and password', 'error');
            }
        }
    }

    // --- 2. FORGOT PASSWORD FUNCTION ---
    async function forgotPass() {
        // Step 1: Ask for Email
        const { value: email } = await Swal.fire({
            title: 'Reset Password',
            input: 'email',
            inputLabel: 'Enter your registered email address',
            inputPlaceholder: 'student@uitm.edu.my',
            confirmButtonColor: '#7023d5',
            showCancelButton: true
        });

        if (email) {
            // Step 2: Ask for New Password
            const { value: password } = await Swal.fire({
                title: 'New Password',
                input: 'password',
                inputLabel: 'Enter your new password',
                inputPlaceholder: 'New Password',
                confirmButtonColor: '#7023d5',
                showCancelButton: true,
                inputAttributes: {
                    autocapitalize: 'off',
                    autocorrect: 'off'
                }
            });

            if (password) {
                // Update the password in storage
                localStorage.setItem("validPass", password);
                
                Swal.fire({
                    title: 'Success!',
                    text: 'Your password has been reset successfully. Please login with your new password.',
                    icon: 'success',
                    confirmButtonColor: '#7023d5'
                });
            }
        }
    }

    // --- 3. ENTER KEY SHORTCUT ---
    document.getElementById("password").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        login();
      }
    });
</script>

</body>
</html>
